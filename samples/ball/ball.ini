; ball - the tiny Norx program shown on the norx website
; Hold the right arrow (or D) to move the ball to the right.

[Display]
Title           = Norx Ball
ScreenWidth     = 640
ScreenHeight    = 360
FullScreen      = false
Decoration      = true
Smoothing       = false
VSync           = true

[Input]
SetList         = MainInput

[MainInput]
KEY_RIGHT       = MoveRight
KEY_D           = MoveRight

[MainViewport]
Camera          = MainCamera
BackgroundColor = (10, 15, 24)

[MainCamera]
FrustumWidth    = 640
FrustumHeight   = 360
FrustumFar      = 2
FrustumNear     = 0
Position        = (0, 0, -1)

[Ball]
Graphic         = @
Texture         = pixel
Pivot           = center
Color           = (255, 213, 74)
Size            = (24, 24, 0)
FXList          = PulseFX

[PulseFX]
SlotList        = @
Type            = scale
Curve           = sine
Period          = 0.6
Loop            = true
StartValue      = (1, 1, 1)
EndValue        = (1.15, 1.15, 1)
