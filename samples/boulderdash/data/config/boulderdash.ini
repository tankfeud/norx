; Boulder Dash - Norx sample game

[Display]
Title           = Boulder Dash
ScreenWidth     = 640
ScreenHeight    = 480
FullScreen      = false
Decoration      = true
Smoothing       = false
VSync           = true

[Resource]
Texture         = ./data/texture
Sound           = ./data/sound

[Input]
SetList         = MainInput

[MainInput]
KEY_ESCAPE      = Quit
KEY_R           = Restart
KEY_N           = NewLevel
KEY_W           = MoveUp
KEY_UP          = MoveUp
KEY_S           = MoveDown
KEY_DOWN        = MoveDown
KEY_A           = MoveLeft
KEY_LEFT        = MoveLeft
KEY_D           = MoveRight
KEY_RIGHT       = MoveRight

[MainViewport]
Camera          = MainCamera
BackgroundColor = (12, 15, 24)

[MainCamera]
FrustumWidth    = 640
FrustumHeight   = 480
FrustumFar      = 2
FrustumNear     = 0
Position        = (0, 0, -1)

[Player]
Graphic         = @
Texture         = player.png
Pivot           = center
Scale           = 0.421875

[Dirt]
Graphic         = @
Texture         = dirt.png
Pivot           = center
Scale           = 0.4375

[Wall]
Graphic         = @
Texture         = wall.png
Pivot           = center
Scale           = 0.4375

[Boulder]
Graphic         = @
Texture         = boulder.png
Pivot           = center
Scale           = 0.40625

[Diamond]
Graphic         = @
Texture         = diamond.png
Pivot           = center
Scale           = 0.375

[Exit]
Graphic         = @
Texture         = exit.png
Pivot           = center
Scale           = 0.421875

[DigSound]
Sound           = dig.ogg
KeepInCache     = true
Volume          = 0.35

[PushSound]
Sound           = push.ogg
KeepInCache     = true
Volume          = 0.4

[LandSound]
Sound           = land.ogg
KeepInCache     = true
Volume          = 0.3

[CollectSound]
Sound           = collect.ogg
KeepInCache     = true
Volume          = 0.55

[WinSound]
Sound           = win.ogg
KeepInCache     = true
Volume          = 0.65

[LoseSound]
Sound           = lose.ogg
KeepInCache     = true
Volume          = 0.55

[Hud]
Text            = @
String          = Score: 0    Diamonds: 0    Time: 120
Position        = (-300, -231, -0.5)
Scale           = 0.7
Color           = (235, 240, 255)

[Help]
Text            = @
String          = WASD / arrows: move    N: new cave    R: restart    Esc: quit
Position        = (-300, 218, -0.5)
Scale           = 0.55
Color           = (150, 165, 195)

[Message]
Text            = @
String          = Ready
Position        = (0, 0, -0.75)
Pivot           = center
Scale           = 0.8
Color           = (255, 225, 90)

; Exactly 20 columns by 15 rows.
; # wall, O boulder, . dirt, D diamond, E exit, @ player.
[LevelData]
Row0  = "####################"
Row1  = "#@...O....D........#"
Row2  = "#....#.......O.....#"
Row3  = "#.D..#..O..........#"
Row4  = "#....#.............#"
Row5  = "#....#####..#####..#"
Row6  = "#..O......D........#"
Row7  = "#......O...........#"
Row8  = "#..D...........O...#"
Row9  = "#.....####.........#"
Row10 = "#.O........D.......#"
Row11 = "#......O...........#"
Row12 = "#..D...............#"
Row13 = "#.................E#"
Row14 = "####################"
