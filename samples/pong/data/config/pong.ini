; Pong - Norx sample game

[Display]
Title           = Pong - Norx
ScreenWidth     = 960
ScreenHeight    = 540
FullScreen      = false
Decoration      = true
Smoothing       = false
VSync           = true

[Input]
SetList         = MainInput

[MainInput]
KEY_ESCAPE      = Quit
KEY_R           = Restart
KEY_SPACE       = Pause
KEY_W           = LeftUp
KEY_S           = LeftDown
KEY_UP          = RightUp
KEY_DOWN        = RightDown

[Mouse]
ShowCursor      = false

[MainViewport]
Camera          = MainCamera
BackgroundColor = (8, 12, 24)

[MainCamera]
FrustumWidth    = 960
FrustumHeight   = 540
FrustumFar      = 2
FrustumNear     = 0
Position        = (0, 0, -1)

; Static court elements are created as one data-driven object hierarchy.
[Court]
ChildList       = TopBorder # BottomBorder # CenterLine # LeftHint # RightHint # Help

[CourtLine]
Graphic         = @
Texture         = pixel
Pivot           = center
Color           = (105, 130, 170)
Alpha           = 0.35

[TopBorder@CourtLine]
Position        = (0, -204, 0)
Size            = (920, 4, 0)

[BottomBorder@CourtLine]
Position        = (0, 204, 0)
Size            = (920, 4, 0)

[CenterLine@CourtLine]
Position        = (0, 0, 0)
Size            = (3, 404, 0)
Alpha           = 0.18

[HintText]
Graphic         = @
Text            = @
Locale          = false
Pivot           = center
Scale           = 1.0
Color           = (105, 130, 170)

[LeftHint@HintText]
String          = PLAYER 1  [W / S]
Position        = (-330, -238, 0)

[RightHint@HintText]
String          = PLAYER 2  [UP / DOWN]
Position        = (330, -238, 0)

[Help@HintText]
String          = SPACE  PAUSE     R  RESTART     ESC  QUIT
Position        = (0, 238, 0)
Scale           = 0.9

[Paddle]
Graphic         = @
Texture         = pixel
Pivot           = center
Size            = (16, 104, 0)

[LeftPaddle@Paddle]
Position        = (-410, 0, 0)
Color           = (41, 224, 255)

[RightPaddle@Paddle]
Position        = (410, 0, 0)
Color           = (255, 77, 166)

[Ball]
Graphic         = @
Texture         = pixel
Pivot           = center
Size            = (16, 16, 0)
Color           = (255, 226, 105)

[WallSound]
Sound           = land.ogg
KeepInCache     = true
Volume          = 0.22
Pitch           = 1.25

[PaddleSound]
Sound           = push.ogg
KeepInCache     = true
Volume          = 0.3
Pitch           = 1.1

[PointSound]
Sound           = collect.ogg
KeepInCache     = true
Volume          = 0.45

[WinSound]
Sound           = win.ogg
KeepInCache     = true
Volume          = 0.55

[Score]
Graphic         = @
Text            = @
Locale          = false
String          = 0
Pivot           = center
Scale           = 2.4
Color           = (235, 241, 255)

[LeftScore@Score]
Position        = (-120, -238, -0.25)

[RightScore@Score]
Position        = (120, -238, -0.25)

[Status]
Graphic         = @
Text            = @
Locale          = false
String          = READY
Pivot           = center
Position        = (0, 0, -0.5)
Scale           = 1.5
Color           = (235, 241, 255)

; Short data-driven accents triggered by the Nim game model.
[PaddleHit]
SlotList        = PaddleHitScale
DoNotCache      = true

[PaddleHitScale]
Type            = scale
StartTime       = 0
EndTime         = 0.12
Curve           = sine
StartValue      = (1, 1, 1)
EndValue        = (1.18, 1.18, 1)

[ScorePulse]
SlotList        = ScorePulseScale
DoNotCache      = true

[ScorePulseScale]
Type            = scale
StartTime       = 0
EndTime         = 0.2
Curve           = sine
StartValue      = (1, 1, 1)
EndValue        = (1.35, 1.35, 1)
